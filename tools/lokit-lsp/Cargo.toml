[package]
name = "lokit-lsp"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Language Server Protocol implementation for Lokit interchange files"
license = "MIT"

[[bin]]
name = "lokit-lsp"
path = "src/main.rs"

[dependencies]
lokit-format = { path = "../../native/lokit-format" }
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines", "simd"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tower-lsp-server = { version = "=0.23.0", default-features = true }

[dev-dependencies]
futures = "0.3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
