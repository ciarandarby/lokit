name: Build and Publish Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_version:
        description: "Expected package version or v-prefixed release tag"
        required: true
        type: string
      publish:
        description: "Publish built distributions to PyPI"
        required: false
        default: false
        type: boolean

jobs:
  verify_release_identity:
    name: Verify release identity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual publishing ref
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          REQUESTED_RELEASE: ${{ inputs.release_version }}
        run: |
          normalized_release="${REQUESTED_RELEASE#v}"
          if [[ "$DISPATCH_REF" == "refs/heads/$DEFAULT_BRANCH" ||
                "$DISPATCH_REF" == "refs/tags/$normalized_release" ||
                "$DISPATCH_REF" == "refs/tags/v$normalized_release" ]]; then
            exit 0
          fi
          echo "Publishing is restricted to the default branch or a tag matching the requested release." >&2
          exit 1

      - name: Verify release cohorts and requested version
        env:
          EXPECTED_RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_version }}
        run: python tools/verify_release_versions.py --expected-release "$EXPECTED_RELEASE"

  full_ci:
    name: Full release CI
    needs: verify_release_identity
    uses: ./.github/workflows/ci.yml

  build_wheels:
    name: Build wheels for ${{ matrix.rid }}
    needs: [verify_release_identity, full_ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            cibw_arch: x86_64
          - os: windows-latest
            rid: win-x64
            cibw_arch: AMD64
          - os: macos-15
            rid: osx-arm64
            cibw_arch: arm64
          - os: macos-15-intel
            rid: osx-x64
            cibw_arch: x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install .NET 10 SDK
        if: runner.os != 'Linux'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/office/**/packages*.lock.json

      - name: Build manylinux Office runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --env GITHUB_SHA --volume "$PWD:/project" --workdir /project \
            quay.io/pypa/manylinux_2_28_x86_64 /bin/bash -lc '
              dnf install -y brotli-devel clang curl openssl-devel zlib-devel &&
              curl --proto "=https" --tlsv1.2 -sSf https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh &&
              bash /tmp/dotnet-install.sh --version 10.0.300 --install-dir /tmp/dotnet &&
              export DOTNET_ROOT=/tmp/dotnet &&
              export PATH="$DOTNET_ROOT:$PATH" &&
              dotnet --info &&
              /opt/python/cp312-cp312/bin/python tools/build_office_runtime.py linux-x64 "$GITHUB_SHA"
            '

      - name: Build macOS Office runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install brotli openssl@3
          runtime_libraries="$RUNNER_TEMP/lokit-office-static"
          mkdir -p "$runtime_libraries"
          cp "$(brew --prefix openssl@3)/lib/libssl.a" "$(brew --prefix openssl@3)/lib/libcrypto.a" "$runtime_libraries/"
          cp "$(brew --prefix brotli)/lib/libbrotlienc.a" "$(brew --prefix brotli)/lib/libbrotlidec.a" \
            "$(brew --prefix brotli)/lib/libbrotlicommon.a" "$runtime_libraries/"
          python tools/build_office_runtime.py "${{ matrix.rid }}" "$GITHUB_SHA" "$runtime_libraries"

      - name: Build Windows Office runtime
        if: runner.os == 'Windows'
        run: python tools/build_office_runtime.py "${{ matrix.rid }}" "$env:GITHUB_SHA"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_BEFORE_ALL_LINUX: |
            dnf install -y brotli openssl-libs
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=12.0"
          CIBW_TEST_COMMAND: |
            python {project}/tools/verify_release_versions.py
            python {project}/tools/verify_mypyc_install.py
            python {project}/tools/verify_native_install.py
            python {project}/tools/smoke_test_wheel.py

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.rid }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: [verify_release_identity, full_ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        env:
          EXPECTED_RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_version }}
        run: |
          uv build --sdist --clear
          python tools/verify_sdist_contents.py dist/*.tar.gz --extract-to .sdist-source
          python .sdist-source/*/tools/verify_release_versions.py --sdist --expected-release "$EXPECTED_RELEASE"

      - name: Build and smoke-test a wheel from the sdist
        run: |
          uv build --wheel dist/*.tar.gz --out-dir sdist-wheel
          uv venv .sdist-smoke --python 3.12
          uv pip install --strict --python .sdist-smoke/bin/python sdist-wheel/*.whl
          .sdist-smoke/bin/python .sdist-source/*/tools/verify_mypyc_install.py
          .sdist-smoke/bin/python .sdist-source/*/tools/verify_native_install.py
          .sdist-smoke/bin/python .sdist-source/*/tools/smoke_test_wheel.py
          uv pip check --python .sdist-smoke/bin/python

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_lsp_binaries:
    name: Build LSP binary for ${{ matrix.target }}
    needs: [verify_release_identity, full_ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: lokit-lsp
            format: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lokit-lsp.exe
            format: zip
          - os: macos-15
            target: aarch64-apple-darwin
            binary: lokit-lsp
            format: tar
          - os: macos-15
            target: x86_64-apple-darwin
            binary: lokit-lsp
            format: tar

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Build language server
        run: >-
          cargo build --release --locked
          --target ${{ matrix.target }}
          --manifest-path tools/lokit-lsp/Cargo.toml

      - name: Package Unix language server
        if: matrix.format == 'tar'
        shell: bash
        run: |
          version="$(awk -F '"' '/^version = "/ { print $2; exit }' tools/lokit-lsp/Cargo.toml)"
          asset="lokit-lsp-${version}-${{ matrix.target }}"
          mkdir "$asset"
          cp "tools/lokit-lsp/target/${{ matrix.target }}/release/${{ matrix.binary }}" "$asset/"
          cp LICENSE "$asset/"
          cp tools/lokit-lsp/README.md "$asset/"
          tar -czf "$asset.tar.gz" "$asset"
          shasum -a 256 "$asset.tar.gz" > "$asset.tar.gz.sha256"

      - name: Package Windows language server
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          $VersionMatch = Select-String -Path tools/lokit-lsp/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $Version = $VersionMatch.Matches[0].Groups[1].Value
          $Asset = "lokit-lsp-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $Asset
          Copy-Item "tools/lokit-lsp/target/${{ matrix.target }}/release/${{ matrix.binary }}" $Asset
          Copy-Item LICENSE $Asset
          Copy-Item tools/lokit-lsp/README.md $Asset
          Compress-Archive -Path $Asset -DestinationPath "$Asset.zip"
          $Hash = (Get-FileHash -Algorithm SHA256 "$Asset.zip").Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path "$Asset.zip.sha256" -Value "$Hash  $Asset.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: lsp-release-${{ matrix.target }}
          path: |
            lokit-lsp-*.tar.gz
            lokit-lsp-*.tar.gz.sha256
            lokit-lsp-*.zip
            lokit-lsp-*.zip.sha256
          if-no-files-found: error

  build_editor_artifacts:
    name: Build LSP editor artifacts
    needs: [verify_release_identity, full_ci]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip2

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/lokit-lsp/editors/vscode/package-lock.json

      - name: Build VS Code extension
        working-directory: tools/lokit-lsp/editors/vscode
        shell: bash
        run: |
          version="$(awk -F '"' '/^  "version": "/ { print $4; exit }' package.json)"
          npm ci --ignore-scripts
          npm run package -- --out "lokit-language-client-${version}.vsix"
          sha256sum "lokit-language-client-${version}.vsix" > "lokit-language-client-${version}.vsix.sha256"

      - name: Build and package Zed extension
        shell: bash
        run: |
          cargo build --release --locked --target wasm32-wasip2 --manifest-path tools/lokit-lsp/editors/zed/Cargo.toml
          version="$(awk -F '"' '/^version = "/ { print $2; exit }' tools/lokit-lsp/editors/zed/extension.toml)"
          asset="lokit-zed-${version}"
          mkdir "$asset"
          cp tools/lokit-lsp/editors/zed/extension.toml "$asset/"
          cp -R tools/lokit-lsp/editors/zed/languages "$asset/"
          cp tools/lokit-lsp/editors/zed/target/wasm32-wasip2/release/lokit_zed.wasm "$asset/extension.wasm"
          cp LICENSE "$asset/"
          tar -czf "$asset.tar.gz" "$asset"
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"

      - name: Stage editor release assets
        shell: bash
        run: |
          mkdir editor-release-assets
          cp tools/lokit-lsp/editors/vscode/lokit-language-client-*.vsix editor-release-assets/
          cp tools/lokit-lsp/editors/vscode/lokit-language-client-*.vsix.sha256 editor-release-assets/
          cp lokit-zed-*.tar.gz editor-release-assets/
          cp lokit-zed-*.tar.gz.sha256 editor-release-assets/

      - uses: actions/upload-artifact@v6
        with:
          name: editor-release-artifacts
          path: editor-release-assets/*
          if-no-files-found: error

  publish-to-pypi:
    name: Publish Python package to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
         github.ref == format('refs/tags/{0}', inputs.release_version) ||
         github.ref == format('refs/tags/v{0}', inputs.release_version) ||
         (startsWith(github.ref, 'refs/tags/') &&
          inputs.release_version == format('v{0}', github.ref_name))))

    environment:
      name: pypi
      url: https://pypi.org/p/lokit-python

    permissions:
      id-token: write
      contents: read
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate distribution metadata
        run: |
          python -m pip install --disable-pip-version-check twine==6.2.0
          python -m twine check --strict dist/*

      - name: Attest release distributions
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  attach-release-assets:
    name: Attach LSP and editor release assets
    needs: [build_lsp_binaries, build_editor_artifacts, publish-to-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: "*-release-*"
          path: release-assets
          merge-multiple: true

      - name: Attach assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
