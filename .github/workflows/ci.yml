name: CI

on:
  workflow_call:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-libraries:
    name: Rust ${{ matrix.name }} (MSRV ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lokit-format
            manifest: native/lokit-format/Cargo.toml
            toolchain: 1.83.0
          - name: Python extension
            manifest: native/interchange/Cargo.toml
            toolchain: 1.83.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path ${{ matrix.manifest }} -- --check

      - name: Lint Rust crate
        run: cargo clippy --locked --manifest-path ${{ matrix.manifest }} --all-targets --all-features -- -D warnings

      - name: Test Rust crate
        run: cargo test --locked --manifest-path ${{ matrix.manifest }} --all-features

  language-server:
    name: Rust language server (MSRV 1.85, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path tools/lokit-lsp/Cargo.toml -- --check

      - name: Lint language server
        run: cargo clippy --locked --manifest-path tools/lokit-lsp/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test language server
        run: cargo test --locked --manifest-path tools/lokit-lsp/Cargo.toml --all-features

      - name: Build release language server
        run: cargo build --release --locked --manifest-path tools/lokit-lsp/Cargo.toml

  editor-clients:
    name: LSP editor clients
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
          targets: wasm32-wasip2

      - name: Check Zed client wrapper
        run: |
          cargo fmt --manifest-path tools/lokit-lsp/editors/zed/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/lokit-lsp/editors/zed/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path tools/lokit-lsp/editors/zed/Cargo.toml --all-features
          cargo build --release --locked --target wasm32-wasip2 --manifest-path tools/lokit-lsp/editors/zed/Cargo.toml

      - name: Check VS Code client wrapper
        working-directory: tools/lokit-lsp/editors/vscode
        run: |
          npm ci --ignore-scripts
          node --check extension.js
          npm audit --audit-level=high
          npm run package
          node --check dist/extension.js

  office-worker:
    name: .NET Office worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/office/**/packages*.lock.json

      - name: Restore locked dependencies
        run: dotnet restore src/office/Lokit.Office.sln --locked-mode

      - name: Build Office worker
        run: dotnet build src/office/Lokit.Office.sln --configuration Release --no-restore

      - name: Test Office worker
        run: dotnet test src/office/Lokit.Office.sln --configuration Release --no-build --no-restore

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_NO_SYNC: "1"
      UV_PYTHON: ${{ matrix.python-version }}
      LOKIT_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/lokit_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lokit_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=lokit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups --no-install-project

      - name: Verify Python version
        run: >-
          uv run python -c "import os, sys; expected = os.environ['UV_PYTHON'];
          actual = f'{sys.version_info.major}.{sys.version_info.minor}';
          assert actual == expected, f'expected Python {expected}, got {actual}'"

      - name: Typecheck with mypy
        run: |
          uv run mypy -p lokit
          uv run mypy -p lokit_office_runtime
          uv run mypy tests
          uv run mypy --strict setup.py tools
          uv run mypy --strict code_examples/lokit_format.py

      - name: Verify Windows type portability
        if: matrix.python-version == '3.12'
        run: |
          uv run mypy --platform win32 -p lokit
          uv run mypy --platform win32 -p lokit_office_runtime
          uv run mypy --platform win32 tests
          uv run mypy --strict --platform win32 setup.py tools
          uv run mypy --strict --platform win32 code_examples/lokit_format.py

      - name: Lint and check Python formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Build and verify installed wheel
        run: |
          uv run python tools/verify_release_versions.py
          uv run python tools/generate_mypyc_manifest.py
          git diff --exit-code -- src/lokit/_compiled_manifest.py
          uv build --wheel --clear --out-dir test-wheel
          uv pip install --strict --python .venv/bin/python --no-deps --reinstall-package lokit-python test-wheel/*.whl
          uv run python tools/verify_mypyc_install.py
          uv run python tools/verify_native_install.py

      - name: Run pytest
        run: uv run pytest

  wheel-smoke:
    name: Wheel smoke test for ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            cibw_arch: x86_64
          - os: windows-latest
            rid: win-x64
            cibw_arch: AMD64
          - os: macos-15
            rid: osx-arm64
            cibw_arch: arm64
          - os: macos-15-intel
            rid: osx-x64
            cibw_arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install .NET 10 SDK
        if: runner.os != 'Linux'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/office/**/packages*.lock.json

      - name: Build manylinux Office runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --env GITHUB_SHA --volume "$PWD:/project" --workdir /project \
            quay.io/pypa/manylinux_2_28_x86_64 /bin/bash -lc '
              dnf install -y brotli-devel clang curl openssl-devel zlib-devel &&
              curl --proto "=https" --tlsv1.2 -sSf https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh &&
              bash /tmp/dotnet-install.sh --version 10.0.300 --install-dir /tmp/dotnet &&
              export DOTNET_ROOT=/tmp/dotnet &&
              export PATH="$DOTNET_ROOT:$PATH" &&
              dotnet --info &&
              /opt/python/cp312-cp312/bin/python tools/build_office_runtime.py linux-x64 "$GITHUB_SHA"
            '

      - name: Build macOS Office runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install brotli openssl@3
          runtime_libraries="$RUNNER_TEMP/lokit-office-static"
          mkdir -p "$runtime_libraries"
          cp "$(brew --prefix openssl@3)/lib/libssl.a" "$(brew --prefix openssl@3)/lib/libcrypto.a" "$runtime_libraries/"
          cp "$(brew --prefix brotli)/lib/libbrotlienc.a" "$(brew --prefix brotli)/lib/libbrotlidec.a" \
            "$(brew --prefix brotli)/lib/libbrotlicommon.a" "$runtime_libraries/"
          python tools/build_office_runtime.py "${{ matrix.rid }}" "$GITHUB_SHA" "$runtime_libraries"

      - name: Build Windows Office runtime
        if: runner.os == 'Windows'
        run: python tools/build_office_runtime.py "${{ matrix.rid }}" "$env:GITHUB_SHA"

      - name: Build and test an installed wheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_BEFORE_ALL_LINUX: |
            dnf install -y brotli openssl-libs
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=12.0"
          CIBW_TEST_COMMAND: |
            python {project}/tools/verify_release_versions.py
            python {project}/tools/verify_mypyc_install.py
            python {project}/tools/verify_native_install.py
            python {project}/tools/smoke_test_wheel.py

  sdist-smoke:
    name: Source distribution smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"

      - name: Build and verify source distribution
        run: |
          uv run --no-project --python 3.12 python tools/verify_release_versions.py
          uv build --sdist --clear
          uv run --no-project --python 3.12 python tools/verify_sdist_contents.py dist/*.tar.gz --extract-to .sdist-source
          uv run --no-project --python 3.12 python .sdist-source/*/tools/verify_release_versions.py --sdist

      - name: Build wheel from source distribution
        run: uv build --wheel dist/*.tar.gz --out-dir sdist-wheel

      - name: Verify isolated source-distribution wheel
        run: |
          uv venv .sdist-smoke --python 3.12
          uv pip install --strict --python .sdist-smoke/bin/python sdist-wheel/*.whl
          .sdist-smoke/bin/python .sdist-source/*/tools/verify_mypyc_install.py
          .sdist-smoke/bin/python .sdist-source/*/tools/verify_native_install.py
          .sdist-smoke/bin/python .sdist-source/*/tools/smoke_test_wheel.py
          uv pip check --python .sdist-smoke/bin/python

      - name: Validate distribution metadata
        run: uvx --python 3.12 --from twine==6.2.0 twine check --strict dist/*.tar.gz sdist-wheel/*.whl
