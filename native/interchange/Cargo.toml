[package]
name = "lokit-interchange"
version = "0.5.4"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "_interchange_rust"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
lokit-format = { path = "../lokit-format" }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
quick-xml = { version = "0.41.0", features = ["encoding"] }
serde_json = "1.0"
csv-core = "0.1.13"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma"] }
tempfile = "=3.23.0"

[build-dependencies]
pyo3-build-config = "0.29.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
